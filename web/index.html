<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f6b5c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SingTags" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>SingTags</title>
    <meta
      name="description"
      content="Browse, learn, and share barbershop tags — sheets, learning tracks, and more."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SingTags" />
    <meta property="og:title" content="SingTags" />
    <meta
      property="og:description"
      content="Browse, learn, and share barbershop tags — sheets, learning tracks, and more."
    />
    <meta property="og:url" content="https://www.singtags.com/" />
    <meta property="og:image" content="https://www.singtags.com/apple-touch-icon.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SingTags" />
    <meta
      name="twitter:description"
      content="Browse, learn, and share barbershop tags — sheets, learning tracks, and more."
    />
    <meta name="twitter:image" content="https://www.singtags.com/apple-touch-icon.png" />
    <script>
      // Before any content paints: stop the browser from restoring a prior scrollY
      // on reload (SPA catalog height arrives later and would land mid-list).
      try {
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual'
      } catch (_) {}
      // Stamp narrow vs wide before Vue so Browse checkboxes / jump labels match
      // the phone viewport on first paint (not after onMounted matchMedia).
      try {
        var narrow = window.matchMedia('(max-width: 639px)').matches
        document.documentElement.dataset.narrow = narrow ? '1' : '0'
      } catch (_) {
        document.documentElement.dataset.narrow = '1'
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
