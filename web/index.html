<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f6b5c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SingTags" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>SingTags</title>
    <meta
      name="description"
      content="Browse, learn, and share barbershop tags — sheets, learning tracks, and more."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SingTags" />
    <meta property="og:title" content="SingTags" />
    <meta
      property="og:description"
      content="Browse, learn, and share barbershop tags — sheets, learning tracks, and more."
    />
    <meta property="og:url" content="https://www.singtags.com/" />
    <meta property="og:image" content="https://www.singtags.com/apple-touch-icon.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SingTags" />
    <meta
      name="twitter:description"
      content="Browse, learn, and share barbershop tags — sheets, learning tracks, and more."
    />
    <meta name="twitter:image" content="https://www.singtags.com/apple-touch-icon.png" />
    <script>
      // Before any content paints: stop the browser from restoring a prior scrollY
      // on reload (SPA catalog height arrives later and would land mid-list).
      try {
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual'
      } catch (_) {}
      // Stamp narrow vs wide before Vue so Browse checkboxes / jump labels match
      // the phone viewport on first paint (not after onMounted matchMedia).
      try {
        var narrow = window.matchMedia('(max-width: 639px)').matches
        document.documentElement.dataset.narrow = narrow ? '1' : '0'
      } catch (_) {
        document.documentElement.dataset.narrow = '1'
      }
      // Theme / embolden / display scale from localStorage before CSS paints, so
      // main.ts hydration does not flash weight, color, or zoom after first paint.
      try {
        var root = document.documentElement
        var theme = localStorage.getItem('singtags.theme.v1')
        var themeColors = {
          light: '#0f6b5c',
          dark: '#2a8a76',
          'hc-light': '#005a4a',
          'hc-dark': '#3aa890',
        }
        if (theme === 'dark' || theme === 'hc-dark' || theme === 'hc-light') {
          root.setAttribute('data-theme', theme)
          root.style.colorScheme = theme === 'hc-light' ? 'light' : 'dark'
          var themeMeta = document.querySelector('meta[name="theme-color"]')
          if (themeMeta) themeMeta.setAttribute('content', themeColors[theme])
        }
        if (localStorage.getItem('singtags.embolden.v1') === '1') {
          root.setAttribute('data-embolden', '1')
        }
        var scaleRaw = localStorage.getItem('singtags.uiScale.v1')
        if (scaleRaw) {
          var scale = Math.round(Number(scaleRaw) / 5) * 5
          if (scale >= 70 && scale <= 130 && scale !== 100) {
            var zoom = String(scale / 100)
            root.style.zoom = zoom
            root.style.setProperty('--ui-scale', zoom)
            root.dataset.uiScale = String(scale)
          }
        }
      } catch (_) {}
      // Pull-to-refresh at Browse search top: pagehide may leave a Y≈0 snapshot while
      // the reload URL still has a stale ?at=. Strip it before Vue paints mid-list chrome.
      try {
        var browseReloadRaw = sessionStorage.getItem('singtags.browseReload.scroll.v1')
        if (browseReloadRaw) {
          var browseReloadSnap = JSON.parse(browseReloadRaw)
          var browseReloadY = Math.round(Number(browseReloadSnap && browseReloadSnap.scrollY) || 0)
          var browseReloadAge = Date.now() - (Number(browseReloadSnap && browseReloadSnap.at) || 0)
          if (browseReloadY <= 24 && browseReloadAge >= 0 && browseReloadAge < 60000) {
            var browseUrl = new URL(location.href)
            var browseScrollKeys = ['at', 'sec', 'scroll', 'sy']
            var browseStripped = false
            for (var bi = 0; bi < browseScrollKeys.length; bi++) {
              if (browseUrl.searchParams.has(browseScrollKeys[bi])) {
                browseUrl.searchParams.delete(browseScrollKeys[bi])
                browseStripped = true
              }
            }
            if (browseStripped) {
              history.replaceState(
                history.state,
                '',
                browseUrl.pathname + browseUrl.search + browseUrl.hash,
              )
            }
          }
        }
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
